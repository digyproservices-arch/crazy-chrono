<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fixture responsive — plateau Solo</title>
<!-- Feuille de style RÉELLE du plateau: la fixture ne duplique aucun style -->
<link rel="stylesheet" href="../../src/styles/Carte.css" />
</head>
<body class="cc-game">
<div id="root">
  <div class="carte-container game-with-sidebar" style="position:relative">
    <div class="cc-game-particles"></div>
    <div class="mobile-hud" data-mobile-only><div class="hud-left"><span class="hud-chip">30s</span><span class="hud-chip">3 pts</span></div><div class="hud-actions"><button type="button">Historique</button></div></div>
    <div class="mobile-history-strip" data-mobile-only><span class="hist-item"><span class="dot" style="background:#0a0"></span>paire 1</span></div>
    <aside class="game-sidebar-fixed">
      <div class="sidebar-content">
        <h3>Manche 2</h3>
        <div class="hud-row"><span>Score</span><span>3</span></div>
        <div class="hud-row"><span>Temps</span><span>28 s</span></div>
      </div>
    </aside>
    <div class="carte" style="position:relative">
      <img class="carte-bg" alt="" src="./solo-board-bg.svg" />
      <svg class="carte-svg-overlay" width="1000" height="1000" viewBox="0 0 1000 1000"
           preserveAspectRatio="xMidYMid slice"
           style="position:absolute;top:0;left:0;pointer-events:auto;width:100%;height:100%;z-index:2">
        <g id="zones"></g>
      </svg>
    </div>
  </div>
</div>
<script>
  // Zones satellites collées aux bords du viewBox, comme dans public/data/zones2.json
  // (certaines zones réelles atteignent x≈997 / y≈0).
  var SATELLITES = [
    { id: 'top', x: 500, y: 30 },
    { id: 'top-right', x: 860, y: 140 },
    { id: 'right', x: 970, y: 500 },
    { id: 'bottom-right', x: 860, y: 860 },
    { id: 'bottom', x: 500, y: 970 },
    { id: 'bottom-left', x: 140, y: 860 },
    { id: 'left', x: 30, y: 500 },
    { id: 'top-left', x: 140, y: 140 }
  ];
  var group = document.getElementById('zones');
  SATELLITES.forEach(function (zone) {
    var circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('cx', zone.x);
    circle.setAttribute('cy', zone.y);
    circle.setAttribute('r', 26);
    circle.setAttribute('class', 'clickable-shape');
    circle.setAttribute('data-zone', zone.id);
    circle.setAttribute('fill', 'rgba(255,0,0,0.55)');
    circle.setAttribute('stroke', '#fff');
    group.appendChild(circle);
  });

  // Réplique le conditionnel de Carte.js: preserveAspectRatio de l'overlay et
  // montage de la HUD mobile / du bandeau historique (isMobile && isPortrait).
  var overlay = document.querySelector('.carte-svg-overlay');
  function syncResponsiveState() {
    var isMobile = window.innerWidth <= 768;
    var isPortrait = window.innerHeight > window.innerWidth;
    overlay.setAttribute('preserveAspectRatio', isMobile && isPortrait ? 'xMidYMid meet' : 'xMidYMid slice');
    document.querySelectorAll('[data-mobile-only]').forEach(function (el) {
      el.style.display = (isMobile && isPortrait) ? '' : 'none';
    });
  }
  syncResponsiveState();
  window.addEventListener('resize', syncResponsiveState);
</script>
</body>
</html>
