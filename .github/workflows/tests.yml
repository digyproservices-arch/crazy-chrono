name: Tests serveur (parité + persistance)

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  server-tests:
    name: Tests Jest serveur
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install server dependencies
        run: cd server && npm ci

      # CTO-012 : les suites de parité/persistance s'appuient sur le harnais de stubs
      # (server/testUtils) et n'ont besoin d'aucun accès Supabase. Injecter
      # SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY activait game-persistence.integration
      # qui, sous jest-environment-node 27, casse au chargement (Headers absent) et
      # écrirait/supprimerait des lignes dans la base de production.
      - name: Run server tests
        env:
          CI: true
          E2E_BACKEND_URL: https://crazy-chrono-backend.onrender.com
        run: node ./node_modules/jest/bin/jest.js server/__tests__/ --verbose --reporters=default --reporters=./server/jest-monitoring-reporter.js
